name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (simulator + AI engine)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AeroMaintenanceAI.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/AeroMaintenanceAI-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/

  ui-check:
    # Installs the release APK on an Android emulator, opens every screen,
    # records the guided demo and fails if the app crashes.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui-check.sh dist/AeroMaintenanceAI.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: ui-check/
