name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (simulator + AI engine)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AeroMaintenanceAI.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/AeroMaintenanceAI-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/

  ui-check:
    # Installs the release APK on an Android emulator, opens every screen,
    # records the guided demo and fails if the app crashes.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui-check.sh dist/AeroMaintenanceAI.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: ui-check/

  publish:
    # Attaches the APK, screenshots and demo recording to a GitHub pre-release,
    # so the APK can be downloaded straight onto a phone.
    needs: [build, ui-check]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          ls -R | head -60
          FILES="apk/AeroMaintenanceAI.apk apk/AeroMaintenanceAI-debug.apk"
          if [ -d ui-check ]; then
            (cd ui-check && zip -qr ../screenshots.zip . -x demo.mp4)
            FILES="$FILES screenshots.zip"
            [ -f ui-check/demo.mp4 ] && FILES="$FILES ui-check/demo.mp4"
          fi
          gh release create "build-${{ github.run_number }}" $FILES \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "AeroMaintenance AI, build ${{ github.run_number }}" \
            --notes "Install AeroMaintenanceAI.apk on an Android 8.0+ phone. Academic prototype using simulated data; not for operational use. UI check: ${{ needs.ui-check.result }}."
